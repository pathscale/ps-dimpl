[package]
name = "ps-dimpl"
authors = ["Martin Algesten <martin@algesten.se>"]
description = "DTLS 1.2/1.3 (Sans-IO, Sync), fork of algesten/dimpl: pure Rust, ChaCha20-Poly1305 only"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/ps-dimpl"
readme = "README.md"
keywords = ["dtls", "tls", "webrtc"]
categories = ["network-programming", "cryptography", "security"]

# MSRV
rust-version = "1.85.0"

[lib]
name = "dimpl"

[features]
default = ["rust-crypto"]

# The only built-in crypto provider. Certificate utilities are always available.
rust-crypto = [
    "dep:chacha20poly1305", "dep:chacha20", "dep:p384", "dep:x25519-dalek",
    "dep:hmac", "dep:ecdsa", "dep:generic-array", "_crypto-common"
]

# Shared parsing and key-loading support for the provider.
_crypto-common = ["dep:sec1"]

[dependencies]
log = "0.4.29"
nom = { version = "8", default-features = false, features = ["std"] }
once_cell = "1.21.3"
rand = "0.9"
arrayvec = "0.7.6"
subtle = "2.6"

der = "0.7"
pkcs8 = { version = "0.10", features = ["pem"] }
sec1 = { version = "0.7", optional = true }
signature = "2.2"
spki = "0.7"
x509-cert = { version = "0.2", default-features = false, features = ["builder", "std"] }

# RustCrypto backend and unconditional certificate generation.
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", optional = true, features = ["ecdh"] }
sha2 = { version = "0.10", features = ["oid"] }
hmac = { version = "0.12", optional = true }
ecdsa = { version = "0.16", optional = true, features = ["signing", "verifying"] }
generic-array = { version = "0.14", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = { version = "0.10", optional = true }
chacha20 = { version = "0.9", optional = true }
x25519-dalek = { version = "2", optional = true, features = ["static_secrets"] }

