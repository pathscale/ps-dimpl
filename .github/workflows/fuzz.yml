name: Fuzz

on:
  push:
    branches: ['main']
  pull_request:
  # Allow manual trigger
  workflow_dispatch:
  # Run mutation harnesses daily
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_dtls_packet
          - fuzz_record_parse
          - fuzz_dtls13_packet
          - fuzz_dtls13_record_parse
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run pure Rust mutation target
        run: cargo run --release --manifest-path fuzz/Cargo.toml --bin ${{ matrix.target }} -- 1 1000
