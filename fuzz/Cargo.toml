[package]
name = "dimpl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies.dimpl]
package = "ps-dimpl"
path = ".."
default-features = false
features = ["rust-crypto"]

[[bin]]
name = "fuzz_dtls_packet"
path = "fuzz_targets/fuzz_dtls_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_record_parse"
path = "fuzz_targets/fuzz_record_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dtls13_packet"
path = "fuzz_targets/fuzz_dtls13_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dtls13_record_parse"
path = "fuzz_targets/fuzz_dtls13_record_parse.rs"
test = false
doc = false
bench = false
